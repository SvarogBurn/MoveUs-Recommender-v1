services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moveus_demo
      POSTGRES_USER: moveus_demo
      POSTGRES_PASSWORD: demo123
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveus_demo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes

  web:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: moveus-demo:latest
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    ports:
      - "8000:8000"
    env_file: .env.demo
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: moveus-demo:latest
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file: .env.demo
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  demo-db-data:
