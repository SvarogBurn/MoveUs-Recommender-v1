<!doctype html>
<html>
  <body
    style="font-family: sans-serif; background-color: #f9f9f9; padding: 2rem"
  >
    <div
      style="
        max-width: 500px;
        margin: auto;
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
      "
    >
      <h2>Welcome to MoveUs!</h2>
      <p>Hi {{ user.display_name }},</p>
      <p>
        Thanks for signing up. Please confirm your email address by clicking
        below:
      </p>
      <p style="text-align: center; margin: 2rem 0">
        <a
          href="{{ password_reset_url }}"
          style="
            background: #0094d1;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
          "
        >
          Confirm Email
        </a>
      </p>
      <p>If you didn't request this, you can ignore this message.</p>
      <img
        width="168px"
        src="https://storage.googleapis.com/moveus-prod-bucket/logo.png"
        alt="MoveUs Logo"
      />
    </div>
  </body>
</html>
